inverters:

  # ======================= Micro / balcony inverters =======================

  - name: Hoymiles HM series
    manufacturer: Hoymiles
    models: HM-300, HM-350, HM-400, HM-600, HM-700, HM-800, HM-1200, HM-1500
    power: 0.3–1.5 kVA
    balcony: true
    ha_docs:
      - title: OpenDTU
        url: https://github.com/tbnobody/OpenDTU
      - title: AhoyDTU
        url: https://github.com/lumapu/ahoy
    criteria:
      local_operation:
        met: true
        reason: >-
          The inverter has no internet connection of its own and feeds in without any gateway.
          Monitoring, power limiting and switching on/off are handled locally by OpenDTU or AhoyDTU
          instead of Hoymiles' cloud-bound DTUs.
      open_interface:
        met: true
        reason: >-
          The proprietary 2.4 GHz radio protocol (nRF24L01+) has been reverse-engineered. OpenDTU and
          AhoyDTU expose live data via web UI, REST API and MQTT with Home Assistant auto-discovery.
      open_hardware:
        met: false
        reason: No schematics or PCB design files are published.
    notes: >-
      The official DTU-Lite/DTU-Pro gateways upload data to the S-Miles cloud. An ESP32 with an nRF24L01+
      module running OpenDTU or AhoyDTU (approx. €20 in parts) replaces them completely.
    sources:
      - https://github.com/tbnobody/OpenDTU
      - https://raspberry.tips/raspberrypi-tutorials/balkonkraftwerk-photovoltaik-wechselrichter-ertrag-auslesen-esp32-micro-controller-mit-opendtu
    last_reviewed: "2026-10"

  - name: Hoymiles HMS series
    manufacturer: Hoymiles
    models: HMS-300…500-1T, HMS-600…1000-2T, HMS-1600…2000-4T (without "W")
    power: 0.3–2 kVA
    balcony: true
    ha_docs:
      - title: OpenDTU
        url: https://github.com/tbnobody/OpenDTU
      - title: AhoyDTU
        url: https://github.com/lumapu/ahoy
    criteria:
      local_operation:
        met: true
        reason: >-
          No internet connection of its own; feeds in without a gateway. Configuration and monitoring
          work fully locally via OpenDTU or AhoyDTU.
      open_interface:
        met: true
        reason: >-
          The sub-GHz radio protocol (CMT2300A) has been reverse-engineered. OpenDTU/AhoyDTU provide MQTT
          with Home Assistant auto-discovery and a REST API.
      open_hardware:
        met: false
        reason: No schematics or PCB design files are published.
    notes: >-
      Requires a DTU board with a CMT2300A radio module (not the nRF24L01+ used for the HM series).
      The Wi-Fi variants (HMS-xxxW) use a different protocol and are listed separately.
    sources:
      - https://github.com/tbnobody/OpenDTU
      - https://raspberry.tips/raspberrypi-tutorials/balkonkraftwerk-photovoltaik-wechselrichter-ertrag-auslesen-esp32-micro-controller-mit-opendtu
    last_reviewed: "2026-10"

  - name: Hoymiles HMS-W series (built-in Wi-Fi)
    manufacturer: Hoymiles
    models: HMS-400W-1T, HMS-800W-2T and other HMS-xxxW variants
    power: 0.4–0.8 kVA
    balcony: true
    ha_docs:
      - title: ha-hoymiles-wifi
        url: https://github.com/suaveolent/ha-hoymiles-wifi
    criteria:
      local_operation:
        met: true
        reason: >-
          Feeds in without internet access. Wi-Fi settings, power limit and on/off can be set locally with
          the open-source hoymiles-wifi library, so the device can run in an isolated network.
      open_interface:
        met: true
        reason: >-
          The protobuf-based local protocol of the integrated DTU has been reverse-engineered (hoymiles-wifi);
          a Home Assistant custom integration exists.
      open_hardware:
        met: false
        reason: No schematics or PCB design files are published.
    caveats:
      - >-
        Once connected to Wi-Fi the device uploads to the S-Miles cloud by default – block its internet
        access at the router/firewall to keep data local.
      - >-
        The integration's authors warn against using the power limit for fast zero-export control
        (EEPROM wear).
    notes: Not supported by OpenDTU/AhoyDTU, which only handle the radio-based models.
    sources:
      - https://github.com/suaveolent/ha-hoymiles-wifi
      - https://pypi.org/project/hoymiles-wifi
    last_reviewed: "2026-10"

  - name: APsystems EZ1 series
    manufacturer: APsystems
    models: EZ1-M (community reports for further EZ1/EZ1D variants)
    power: 0.8 kVA (DE setting)
    balcony: true
    ha_docs:
      - title: Home Assistant core integration
        url: https://www.home-assistant.io/integrations/apsystems/
    criteria:
      local_operation:
        met: true
        reason: >-
          With "Local Mode" set to "Continuously", the inverter is queried and controlled over the LAN
          without the APsystems cloud.
      open_interface:
        met: true
        reason: Official local HTTP API, supported by a Home Assistant core integration.
      open_hardware:
        met: false
        reason: No schematics or PCB design files are published.
    caveats:
      - Local Mode has to be enabled once via Bluetooth in the vendor app.
      - The local API offers no firmware-update endpoint; updates come through the APsystems cloud.
    sources:
      - https://www.home-assistant.io/integrations/apsystems/
      - https://community.home-assistant.io/t/apsystems-ez1-m-ez1-spe-ez1-lv-ez1-h-ez1d-l-ez1d-ez1d-h-community-enhanced-integration-extended-sensors-all-models-overnight-fix-more/994091
    last_reviewed: "2026-10"

  - name: APsystems DS3 series with ECU gateway
    manufacturer: APsystems
    models: DS3-S, DS3-L, DS3, DS3-H with ECU-R / ECU-C / ECU-B
    power: 0.6–0.96 kVA
    balcony: true
    ha_docs:
      - title: homeassistant-apsystems_ecur
        url: https://github.com/ksheumaker/homeassistant-apsystems_ecur
    criteria:
      local_operation:
        met: true
        reason: >-
          The microinverters talk Zigbee to a local ECU gateway, which can be queried on the LAN without
          the EMA cloud.
      open_interface:
        met: true
        reason: >-
          The ECU exposes a local (unofficial, community-documented) socket interface; a Home Assistant
