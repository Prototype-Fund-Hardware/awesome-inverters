      open_hardware:
        met: false
        reason: No schematics or PCB design files are published.
    caveats:
      - >-
        APsystems' EMEA warranty terms require the microinverters to be monitored via the EMA portal –
        check your warranty before cutting the ECU off the internet.
    notes: DS3-S and DS3-L fit plug-in (balcony) limits; DS3 and DS3-H are mainly used on rooftops.
    sources:
      - https://github.com/ksheumaker/homeassistant-apsystems_ecur
      - https://cdn.estg.eu/p/d/3/b/9/d3b95b662c2731d4319a7d9737d4ccc5e08b2c38_APsystems_DS3_series_Datasheet___FR.pdf
      - https://solarproof.com.au/datasheets/inv_datasheet_APsystems%20DS3%20Datasheet.pdf
    last_reviewed: "2026-10"

  - name: Deye microinverters
    manufacturer: Deye
    models: SUN600G3, SUN800G3, SUN-M60/M80 G3/G4, SUN2000G3 (4 MPPT); also sold as Bosswerk MI series
    power: 0.6–2 kVA
    balcony: true
    ha_docs:
      - title: ha-solarman
        url: https://github.com/davidrapan/ha-solarman
    criteria:
      local_operation:
        met: true
        reason: >-
          Runs without internet. The built-in Solarman-type logger can be kept off the cloud by blocking
          internet access or pointing its server setting to an unused local IP.
      open_interface:
        met: true
        reason: >-
          The Solarman V5 protocol (TCP 8899, Modbus inside) is reverse-engineered and widely implemented;
          read and write access via a Home Assistant custom integration.
      open_hardware:
        met: false
        reason: No schematics or PCB design files are published.
    caveats:
      - >-
        The integrated Wi-Fi logger has had security weaknesses (e.g. readable access credentials) –
        change the access-point password and isolate the device in its own network.
    notes: >-
      In November 2024, Deye-branded (hybrid) inverters in the USA, the UK, Pakistan and other countries
      stopped working; Deye attributed this to a built-in authorization check and denied remote control.
      Not specific to microinverters, but a strong argument for keeping inverters off the vendor cloud.
    sources:
      - https://github.com/davidrapan/ha-solarman
      - https://borncity.com/blog/?p=286806
      - https://heise.de/-10183716
    last_reviewed: "2026-10"

  - name: TSUN TSOL-MS series (Gen3/Gen3Plus)
    manufacturer: TSUN
    models: TSOL-MS600/700/800, MS1600/1800/2000, MS3000
    power: 0.6–3 kVA
    balcony: true
    ha_docs:
      - title: tsun-gen3-proxy
        url: https://github.com/s-allius/tsun-gen3-proxy
    criteria:
      local_operation:
        met: true
        reason: >-
          tsun-gen3-proxy collects data locally and its connection to the TSUN cloud can be switched off;
          the inverter keeps feeding in.
      open_interface:
        met: true
        reason: >-
          Reverse-engineered logger protocol; the proxy publishes data to MQTT with Home Assistant
          auto-discovery.
      open_hardware:
        met: false
        reason: No schematics or PCB design files are published.
    caveats:
      - >-
        Without the cloud connection, no remote firmware or parameter updates are possible. Newer firmware
        encrypts cloud traffic (TLS), so the proxy must run in "client mode".
    sources:
      - https://hub.docker.com/r/sallius/tsun-gen3-proxy
      - https://community.home-assistant.io/t/tsun-proxy-now-as-add-on/870131
    last_reviewed: "2026-10"

